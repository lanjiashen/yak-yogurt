name: Usage tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'web/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/usage-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'web/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/usage-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage-tests:
    name: Node 24 / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows x64
            platform: win32
            arch: x64
          - os: macos-15
            label: macOS Apple Silicon
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            label: macOS Intel
            platform: darwin
            arch: x64
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Show and verify test environment
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "const a=require('node:assert/strict'); console.log(process.platform, process.arch, process.version); a.equal(process.platform,process.env.EXPECTED_PLATFORM); a.equal(process.arch,process.env.EXPECTED_ARCH)"
      - name: Run synthetic-log and local-loop tests
        run: node --test
